name: Build and Release

permissions:
  contents: write

on:
  push:
    tags: ['v*']

jobs:
  build-linux:
    runs-on: ubuntu-latest
    container: ubuntu:22.04
    env:
      LLVM_VERSION: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential cmake git python3 wget file \
            curl zip unzip ca-certificates pkg-config \
            lsb-release software-properties-common gnupg \
            patchelf tar gzip

          apt-get install -y --no-install-recommends \
            llvm-${LLVM_VERSION}-dev \
            clang-${LLVM_VERSION} \
            clang-tidy-${LLVM_VERSION} \
            libclang-${LLVM_VERSION}-dev

      - name: Configure CMake
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DLLVM_DIR=/usr/lib/llvm-${LLVM_VERSION}/lib/cmake/llvm

      - name: Build plugin
        run: cmake --build build -j$(nproc)

      - name: Verify plugin
        run: |
          ls -la build/lib/
          file build/lib/codelint-plugin.so

      - name: Create plugin package
        run: |
          chmod +x packaging/scripts/bundle_plugin.sh
          ./packaging/scripts/bundle_plugin.sh

      - name: Create skill package
        run: |
          chmod +x packaging/scripts/bundle_skill.sh
          ./packaging/scripts/bundle_skill.sh

      - name: Verify packages
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          ARCH=$(uname -m)

          echo "=== Plugin Package ==="
          PLUGIN_PACKAGE_NAME="codelint-plugin-${VERSION}-linux-${ARCH}-llvm15"
          ls -la package-output/
          tar -tzf package-output/${PLUGIN_PACKAGE_NAME}.tar.gz

          echo ""
          echo "=== Skill Package ==="
          SKILL_PACKAGE_NAME="clang-tidy-skill-${VERSION}-linux-${ARCH}"
          ls -la package-output/${SKILL_PACKAGE_NAME}/
          tar -tzf package-output/${SKILL_PACKAGE_NAME}.tar.gz

      - name: Test plugin with system clang-tidy
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          ARCH=$(uname -m)
          PLUGIN_PACKAGE_NAME="codelint-plugin-${VERSION}-linux-${ARCH}-llvm15"

          cd package-output/${PLUGIN_PACKAGE_NAME}

          # Test that plugin loads with system clang-tidy-15
          clang-tidy-15 --load=codelint-plugin.so --checks='codelint-*' --list-checks | grep codelint

          cat > /tmp/test.cpp << 'EOF'
          void test() {
            int x;
            int y = 5;
          }
          EOF

          clang-tidy-15 --load=codelint-plugin.so --checks='codelint-init' /tmp/test.cpp 2>&1 | head -20 || true

      - name: Upload plugin package artifact
        uses: actions/upload-artifact@v4
        with:
          name: codelint-plugin-package-linux
          path: package-output/codelint-plugin-*.tar.gz
          retention-days: 5

      - name: Upload skill package artifact
        uses: actions/upload-artifact@v4
        with:
          name: clang-tidy-skill-package-linux
          path: package-output/clang-tidy-skill-*.tar.gz
          retention-days: 5

  release:
    needs: [build-linux]
    if: always() && needs.build-linux.result == 'success'
    runs-on: ubuntu-latest

    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: "*"

      - name: List artifacts
        run: |
          ls -la artifacts/
          find artifacts -type f | sort

      - name: Prepare release assets
        run: |
          mkdir -p release-assets

          # Copy plugin package
          cp artifacts/codelint-plugin-package-linux/codelint-plugin-*.tar.gz release-assets/

          # Copy skill package
          cp artifacts/clang-tidy-skill-package-linux/clang-tidy-skill-*.tar.gz release-assets/

          ls -la release-assets/

      - name: Create GitHub Release
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}

          gh release create v$VERSION \
            --title "v$VERSION" \
            --generate-notes \
            release-assets/*

      - name: Verify release
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          gh release view v$VERSION --json assets,name,tagName
