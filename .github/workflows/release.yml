name: Build and Release

permissions:
  contents: write

on:
  push:
    tags: ['v*']

jobs:
  build-linux:
    runs-on: ubuntu-latest
    container: ubuntu:22.04
    env:
      LLVM_VERSION: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential cmake git python3 wget file \
            curl zip unzip ca-certificates pkg-config \
            lsb-release software-properties-common gnupg \
            patchelf tar gzip

          apt-get install -y --no-install-recommends \
            llvm-${LLVM_VERSION}-dev \
            clang-${LLVM_VERSION} \
            clang-tidy-${LLVM_VERSION} \
            libclang-${LLVM_VERSION}-dev

      - name: Configure CMake
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DENABLE_SINGLETON_CHECK=OFF \
            -DLLVM_DIR=/usr/lib/llvm-${LLVM_VERSION}/lib/cmake/llvm

      - name: Build plugin
        run: cmake --build build -j$(nproc)

      - name: Verify plugin
        run: |
          ls -la build/lib/
          file build/lib/codelint-core.so

      - name: Create release package
        run: |
          chmod +x packaging/scripts/bundle_plugin.sh
          ./packaging/scripts/bundle_plugin.sh

      - name: Verify package
        run: |
          echo "=== Release Package ==="
          ls -la package-output/
          PACKAGE_DIR=$(ls -d package-output/codelint-core-* | head -1)
          tar -tzf "${PACKAGE_DIR}.tar.gz"

      - name: Test plugin with system clang-tidy
        run: |
          set -e  # Fail on any error
          PACKAGE_DIR=$(ls -d package-output/codelint-core-* | head -1)
          cd "${PACKAGE_DIR}"

          # List all checks (does not instantiate them)
          echo "=== Available codelint checks ==="
          clang-tidy-${LLVM_VERSION} --load=$PWD/codelint-core.so --checks='codelint-*' --list-checks | grep codelint

          # IMPORTANT: Test with ALL codelint checks enabled
          # This ensures EVERY check's registerCheck<T>() is instantiated
          # and catches any symbol visibility issues
          cat > /tmp/test.cpp << 'EOF'
          // Test file that exercises multiple codelint checks
          // Uninitialized variable check
          void test_init() {
            int x;
          }

          // Log tag mismatch check (if macros are used)
          // bool condition check
          void test_bool() {
            int flag = 1;
            if (flag) {}
          }
          EOF

          echo ""
          echo "=== Running ALL codelint checks (validate instantiation) ==="
          clang-tidy-${LLVM_VERSION} --load=$PWD/codelint-core.so \
            --checks='codelint-*' \
            /tmp/test.cpp 2>&1

          echo ""
          echo "✅ All codelint checks successfully instantiated!"

      - name: Upload release package artifact
        uses: actions/upload-artifact@v4
        with:
          name: codelint-core-package-linux
          path: package-output/codelint-core-*.tar.gz
          retention-days: 5

  release:
    needs: [build-linux]
    if: always() && needs.build-linux.result == 'success'
    runs-on: ubuntu-latest

    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: "*"

      - name: List artifacts
        run: |
          ls -la artifacts/
          find artifacts -type f | sort

      - name: Prepare release assets
        run: |
          mkdir -p release-assets

          # Copy release package
          cp artifacts/codelint-core-package-linux/codelint-core-*.tar.gz release-assets/

          ls -la release-assets/

      - name: Create GitHub Release
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}

          gh release create v$VERSION \
            --title "v$VERSION" \
            --generate-notes \
            release-assets/*

      - name: Verify release
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          gh release view v$VERSION --json assets,name,tagName
