name: Build and Release

permissions:
  contents: write

on:
  push:
    tags: ['v*']

jobs:
  build-linux:
    runs-on: ubuntu-latest
    container: ubuntu:22.04
    strategy:
      matrix:
        llvm_version: [15, 21]
      fail-fast: false
    env:
      LLVM_VERSION: ${{ matrix.llvm_version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential cmake git python3 wget file \
            curl zip unzip ca-certificates pkg-config \
            lsb-release software-properties-common gnupg \
            patchelf tar gzip

          # LLVM 21 requires apt.llvm.org; LLVM 15 is in Ubuntu 22.04 default repos
          if [ "${LLVM_VERSION}" = "21" ]; then
            wget https://apt.llvm.org/llvm.sh
            chmod +x llvm.sh
            ./llvm.sh 21
          fi

          apt-get install -y --no-install-recommends \
            llvm-${LLVM_VERSION}-dev \
            clang-${LLVM_VERSION} \
            clang-tidy-${LLVM_VERSION} \
            libclang-${LLVM_VERSION}-dev

      - name: Configure CMake
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DLLVM_DIR=/usr/lib/llvm-${LLVM_VERSION}/lib/cmake/llvm

      - name: Build plugin
        run: cmake --build build -j$(nproc)

      - name: Verify plugin
        run: |
          ls -la build/lib/
          file build/lib/codelint-plugin.so

      - name: Upload shared library artifact
        uses: actions/upload-artifact@v4
        with:
          name: codelint-plugin-linux-llvm${{ matrix.llvm_version }}
          path: build/lib/codelint-plugin.so
          retention-days: 5

      - name: Create codelint package (LLVM 21 only)
        if: matrix.llvm_version == 21
        run: |
          chmod +x packaging/scripts/bundle_libs.sh
          ./packaging/scripts/bundle_libs.sh

      - name: Create skill package (LLVM 21 only)
        if: matrix.llvm_version == 21
        run: |
          chmod +x packaging/scripts/bundle_skill.sh
          ./packaging/scripts/bundle_skill.sh --codelint

      - name: Verify codelint package (LLVM 21 only)
        if: matrix.llvm_version == 21
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          ARCH=$(uname -m)
          PACKAGE_NAME="codelint-${VERSION}-linux-${ARCH}"

          ls -la package-output/
          ls -la package-output/${PACKAGE_NAME}/
          file package-output/${PACKAGE_NAME}/bin/clang-tidy
          file package-output/${PACKAGE_NAME}/bin/codelint
          file package-output/${PACKAGE_NAME}/lib/codelint-plugin.so

          tar -tzf package-output/${PACKAGE_NAME}.tar.gz | head -20

      - name: Verify skill package (LLVM 21 only)
        if: matrix.llvm_version == 21
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          ARCH=$(uname -m)
          SKILL_PACKAGE_NAME="clang-tidy-skill-${VERSION}-linux-${ARCH}"

          ls -la package-output/${SKILL_PACKAGE_NAME}/
          file package-output/${SKILL_PACKAGE_NAME}/bin/clang-tidy
          file package-output/${SKILL_PACKAGE_NAME}/lib/codelint-plugin.so

          ls -la package-output/${SKILL_PACKAGE_NAME}/share/clang-tidy-skill/scripts/
          ls -la package-output/${SKILL_PACKAGE_NAME}/share/clang-tidy-skill/configs/

          tar -tzf package-output/${SKILL_PACKAGE_NAME}.tar.gz | head -30

      - name: Test codelint package functionality (LLVM 21 only)
        if: matrix.llvm_version == 21
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          ARCH=$(uname -m)
          PACKAGE_NAME="codelint-${VERSION}-linux-${ARCH}"

          cd package-output/${PACKAGE_NAME}

          export LD_LIBRARY_PATH=$PWD/lib:$LD_LIBRARY_PATH
          ./bin/codelint --version
          ./bin/codelint --list-checks | grep codelint

          cat > /tmp/test.cpp << 'EOF'
          void test() {
            int x;
            int y = 5;
          }
          EOF

          ./bin/codelint /tmp/test.cpp 2>&1 | head -20 || true

      - name: Test skill package functionality (LLVM 21 only)
        if: matrix.llvm_version == 21
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          ARCH=$(uname -m)
          SKILL_PACKAGE_NAME="clang-tidy-skill-${VERSION}-linux-${ARCH}"

          cd package-output/${SKILL_PACKAGE_NAME}

          export LD_LIBRARY_PATH=$PWD/lib:$LD_LIBRARY_PATH
          export PATH=$PWD/bin:$PATH

          ./bin/clang-tidy --version
          ./share/clang-tidy-skill/scripts/run_clang_tidy.py --version
          ./share/clang-tidy-skill/scripts/run_clang_tidy.py --list-checks | head -20

          cat > /tmp/test_skill.cpp << 'EOF'
          void test() {
            int x;
            int y = 5;
          }
          EOF

          ./bin/clang-tidy --load=lib/codelint-plugin.so --checks='codelint-*' /tmp/test_skill.cpp 2>&1 | head -20 || true

      - name: Upload codelint package artifact (LLVM 21 only)
        if: matrix.llvm_version == 21
        uses: actions/upload-artifact@v4
        with:
          name: codelint-package-linux
          path: package-output/codelint-*.tar.gz
          retention-days: 5

      - name: Upload skill package artifact (LLVM 21 only)
        if: matrix.llvm_version == 21
        uses: actions/upload-artifact@v4
        with:
          name: clang-tidy-skill-package-linux
          path: package-output/clang-tidy-skill-*.tar.gz
          retention-days: 5

  release:
    needs: [build-linux]
    if: always() && needs.build-linux.result == 'success'
    runs-on: ubuntu-latest

    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: "*"

      - name: List artifacts
        run: |
          ls -la artifacts/
          find artifacts -type f | sort

      - name: Prepare release assets
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          ARCH=$(uname -m)
          mkdir -p release-assets

          # Copy LLVM 15 shared library with descriptive name
          if [ -f "artifacts/codelint-plugin-linux-llvm15/codelint-plugin.so" ]; then
            cp "artifacts/codelint-plugin-linux-llvm15/codelint-plugin.so" \
               "release-assets/codelint-plugin-${VERSION}-linux-${ARCH}-llvm15.so"
          fi

          # Copy LLVM 21 shared library with descriptive name
          if [ -f "artifacts/codelint-plugin-linux-llvm21/codelint-plugin.so" ]; then
            cp "artifacts/codelint-plugin-linux-llvm21/codelint-plugin.so" \
               "release-assets/codelint-plugin-${VERSION}-linux-${ARCH}-llvm21.so"
          fi

          # Copy full packages (LLVM 21)
          cp artifacts/codelint-package-linux/codelint-*.tar.gz release-assets/ 2>/dev/null || true
          cp artifacts/clang-tidy-skill-package-linux/clang-tidy-skill-*.tar.gz release-assets/ 2>/dev/null || true

          ls -la release-assets/

      - name: Create GitHub Release
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}

          gh release create v$VERSION \
            --title "v$VERSION" \
            --generate-notes \
            release-assets/*

      - name: Verify release
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          gh release view v$VERSION --json assets,name,tagName
