name: Code Check

on:
  push:
    branches: ['*']
  pull_request:
    branches: ['*']

jobs:
  whitespace:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check trailing whitespace
        run: |
          echo "🔍 Checking for trailing whitespace..."
          if grep -r '[[:blank:]]$' \
              --include='*.cpp' \
              --include='*.h' \
              --include='*.txt' \
              --include='*.md' \
              --include='*.sh' \
              --include='*.py' \
              . 2>/dev/null | \
              grep -v '.git/' | \
              grep -v '.sisyphus/' |
              grep -v 'tests/CodeLintTest/src/init_checker/check-output/'; then
            echo "::error::Found trailing whitespace!"
            echo "Please run './scripts/format.sh' to fix."
            exit 1
          fi
          echo "✅ No trailing whitespace found"

      - name: Check trailing newlines
        run: |
          echo "🔍 Checking trailing newlines..."

          find . -type f \( \
            -name '*.cpp' -o \
            -name '*.h' -o \
            -name '*.txt' -o \
            -name '*.md' -o \
            -name '*.sh' -o \
            -name '*.py' \
            \) \
            ! -path './build/*' \
            ! -path './.git/*' \
            -exec sh -c '
              errors=0
              for file; do
                file_size=$(wc -c < "$file" | tr -d " ")

                # Skip empty files (0 bytes or 1 byte newline only)
                if [ "$file_size" -eq 0 ] || [ "$file_size" -eq 1 ]; then
                  continue
                fi

                # Check for multiple trailing newlines
                last_two=$(tail -c 2 "$file" 2>/dev/null | od -An -tx1 | tr -d " \n")
                if [ "$last_two" = "0a0a" ]; then
                  echo "Multiple trailing newlines: $file"
                  errors=$((errors + 1))
                  continue
                fi

                # Check for missing newline
                last=$(tail -c 1 "$file" 2>/dev/null | od -An -tx1 | tr -d " \n")
                if [ "$last" != "0a" ]; then
                  echo "Missing trailing newline: $file"
                  errors=$((errors + 1))
                fi
              done
              exit $errors
            ' sh {} +

          if [ $? -ne 0 ]; then
            echo "::error::Trailing newline check failed!"
            echo "Please ensure all files end with exactly one newline"
            exit 1
          fi
          echo "✅ All files have correct trailing newlines"

      - name: Summary
        run: |
          echo "✨ Whitespace check passed!"
          echo "📊 Total files checked: $(find . -type f \( -name '*.cpp' -o -name '*.h' -o -name '*.txt' -o -name '*.md' -o -name '*.sh' -o -name '*.py' \) ! -path './build/*' ! -path './.git/*' | wc -l | tr -d ' ')"

  build-and-test:
    runs-on: ubuntu-latest
    container: ubuntu:22.04
    strategy:
      matrix:
        llvm_version: [15, 21]
      fail-fast: false
    env:
      LLVM_VERSION: ${{ matrix.llvm_version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Required for git diff

      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential cmake make git wget lsb-release software-properties-common gnupg \
            libzstd-dev libxml2-dev libedit-dev libncurses-dev zlib1g-dev \
            git curl zip unzip ca-certificates pkg-config

          # Configure git safe directory for container
          git config --global --add safe.directory /__w/codelint/codelint

          # LLVM 21 requires apt.llvm.org; LLVM 15 is in Ubuntu 22.04 default repos
          if [ "${LLVM_VERSION}" = "21" ]; then
            wget -4 https://apt.llvm.org/llvm.sh
            chmod +x llvm.sh
            ./llvm.sh 21
          fi

          # Install LLVM development packages
          apt-get install -y --no-install-recommends \
            llvm-${LLVM_VERSION}-dev \
            clang-tidy-${LLVM_VERSION} \
            clang-${LLVM_VERSION} \
            clang-format-${LLVM_VERSION} \
            libclang-${LLVM_VERSION}-dev

          ln -sf /usr/bin/FileCheck-21 /usr/bin/FileCheck || true
          ln -sf /usr/bin/clang-tidy-21 /usr/bin/clang-tidy || true

      - name: Configure CMake
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DLLVM_DIR=/usr/lib/llvm-${LLVM_VERSION}/lib/cmake/llvm

      - name: Build project
        run: cmake --build build -j$(nproc)

      - name: Configure test project compile_commands.json
        run: |
          cd tests/CodeLintTest
          cmake -B build -DCMAKE_CXX_COMPILER=clang++-${LLVM_VERSION}

      - name: Setup PATH for LLVM tools
        run: echo /usr/bin >> $GITHUB_PATH

      - name: Run all tests
        if: matrix.llvm_version == 21
        run: cmake --build build --target test-all

      - name: Run lit-style tests
        run: |
          echo "========================================"
          echo "Running Lit-Style Test Suite"
          echo "========================================"
          
          chmod +x tests/run_lit_tests.sh
          bash tests/run_lit_tests.sh

      - name: Verify plugin loads (LLVM 15 compatibility check)
        if: matrix.llvm_version == 15
        run: |
          echo "🔍 Verifying LLVM 15 plugin compatibility..."
          ls -la build/lib/codelint-plugin.so
          clang-tidy-${LLVM_VERSION} --version
          clang-tidy-${LLVM_VERSION} --load=build/lib/codelint-plugin.so --checks='codelint-*' --list-checks | grep codelint

      - name: Check code formatting
        if: github.event_name == 'pull_request'
        run: |
          echo "🔍 Checking C++ formatting..."
          find src -name '*.cpp' -o -name '*.h' | \
            xargs -r clang-format-${LLVM_VERSION} --dry-run --Werror

      - name: Run clang-tidy with codelint plugin
        if: github.event_name == 'pull_request'
        run: |
          echo "🔍 Running codelint checks..."

          # Check all source files (exclude tests)
          src_files=$(find src -name '*.cpp')

          if [ -z "$src_files" ]; then
            echo "✅ No source files found, skipping codelint"
            exit 0
          fi

          # Run codelint checks (check only, no auto-fix in CI)
          # Safety measures:
          # 1. NO --fix or --fix-errors (prevents modifying any files)
          # 2. Only check src/ files
          # 3. Excludes tests/ directory (only source code)
          clang-tidy-${LLVM_VERSION} \
            --load=build/lib/codelint-plugin.so \
            --checks='codelint-*' \
            -p build \
            $src_files 2>&1 | tee codelint_output.txt

          echo "✅ Codelint checks completed"
